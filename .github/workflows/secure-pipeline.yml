# =============================================================================
# Secure CI/CD Pipeline — DevSecOps Assessment
# =============================================================================
# Security scanners integrated:
#   1. Secret Detection     — custom Python engine (Block 1)
#   2. Dependency Audit     — npm audit (frontend) + OWASP Dependency-Check (backend)
#   3. SAST                 — Semgrep (multi-language static analysis)
#   4. Container Scan       — Trivy image vulnerability scan
#   5. IaC Scan             — Trivy config scan (Dockerfile / docker-compose)
#   6. License Check        — license-checker (frontend)
#
# Quality Gate Logic:
#   CRITICAL findings  → fail immediately, block merge
#   HIGH findings      → fail the relevant job, block merge
#   MEDIUM findings    → warn only, do not block
#   LOW findings       → informational, never block
#
# Scan reports are uploaded as artifacts for every run (pass or fail).
# =============================================================================

name: Secure Pipeline

on:
  push:
    branches: [ "candidate-assessment", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger

env:
  JAVA_VERSION: "11"
  NODE_VERSION: "18"
  REPORTS_DIR: reports

# Cancel in-progress runs on the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # JOB 1: Secret Detection
  # Runs first — fastest check. Fails immediately on any HIGH/CRITICAL secret.
  # ===========================================================================
  secret-detection:
    name: "🔑 Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git-secrets style scanning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create reports directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      - name: Run Secret Detection Engine
        id: secret_scan
        run: |
          python scripts/secret-detection/secret_detector.py \
            --path . \
            --format json \
            --severity HIGH \
            --output ${{ env.REPORTS_DIR }}/secret-scan.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        # continue-on-error so we can upload artifacts even on failure
        continue-on-error: true

      - name: Parse and annotate findings
        if: always()
        run: |
          if [ -f "${{ env.REPORTS_DIR }}/secret-scan.json" ]; then
            TOTAL=$(python -c "import json,sys; d=json.load(open('${{ env.REPORTS_DIR }}/secret-scan.json')); print(d['summary']['total_findings'])")
            CRITICAL=$(python -c "import json,sys; d=json.load(open('${{ env.REPORTS_DIR }}/secret-scan.json')); print(d['summary']['by_severity']['CRITICAL'])")
            HIGH=$(python -c "import json,sys; d=json.load(open('${{ env.REPORTS_DIR }}/secret-scan.json')); print(d['summary']['by_severity']['HIGH'])")
            echo "## 🔑 Secret Detection Results" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total findings | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
            if [ "$TOTAL" -eq "0" ]; then
              echo "✅ **No secrets detected**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Secrets detected — merge blocked**" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: ${{ env.REPORTS_DIR }}/secret-scan.json
          retention-days: 30

      - name: Enforce quality gate — fail on secrets
        if: steps.secret_scan.outcome == 'failure'
        run: |
          echo "❌ QUALITY GATE FAILED: Secrets detected in source code."
          echo "Review ${{ env.REPORTS_DIR }}/secret-scan.json for details."
          exit 1

  # ===========================================================================
  # JOB 2: Frontend Security (React/Node)
  # npm audit + Semgrep SAST + license check
  # ===========================================================================
  frontend-security:
    name: "⚛️ Frontend Security Scan"
    runs-on: ubuntu-latest
    needs: secret-detection  # Only run if no secrets found

    defaults:
      run:
        working-directory: assess/country-flags-app-main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: assess/country-flags-app-main/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Create reports directory
        run: mkdir -p ../../${{ env.REPORTS_DIR }}

      # -------------------------------------------------------------------------
      # Scanner 1: npm audit — dependency vulnerability check
      # Quality gate: fail on CRITICAL/HIGH vulnerabilities
      # -------------------------------------------------------------------------
      - name: npm audit (dependency vulnerabilities)
        id: npm_audit
        run: |
          npm audit --audit-level=high --json > ../../${{ env.REPORTS_DIR }}/npm-audit.json || true
          # Capture high/critical counts
          HIGH_COUNT=$(cat ../../${{ env.REPORTS_DIR }}/npm-audit.json | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            meta=d.get('metadata',{}).get('vulnerabilities',{})
            print(meta.get('high',0)+meta.get('critical',0))
          except: print(0)
          ")
          echo "high_critical_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "npm audit HIGH+CRITICAL count: $HIGH_COUNT"
        continue-on-error: true

      # -------------------------------------------------------------------------
      # Scanner 2: Semgrep SAST — static analysis for security anti-patterns
      # Checks for: XSS, insecure eval, hardcoded secrets, prototype pollution
      # -------------------------------------------------------------------------
      - name: Semgrep SAST scan
        id: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/react
            p/secrets
          generateSarif: "1"
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
        env:
          SEMGREP_TIMEOUT: 300
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.semgrep.outputs.sarif != ''
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      # -------------------------------------------------------------------------
      # Scanner 3: License compliance check
      # Blocks on GPL/AGPL licenses that conflict with commercial use
      # -------------------------------------------------------------------------
      - name: Install license-checker
        run: npm install -g license-checker

      - name: License compliance scan
        id: license_check
        run: |
          license-checker --json --out ../../${{ env.REPORTS_DIR }}/frontend-licenses.json || true
          # Flag any GPL/AGPL licenses
          VIOLATIONS=$(python3 -c "
          import json, sys
          try:
            d=json.load(open('../../${{ env.REPORTS_DIR }}/frontend-licenses.json'))
            blocked=['GPL','AGPL','LGPL','CC-BY-NC']
            found=[k for k,v in d.items() if any(b in str(v.get('licenses','')) for b in blocked)]
            print(len(found))
          except: print(0)
          ")
          echo "license_violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "License violations: $VIOLATIONS"
        continue-on-error: true

      - name: Write frontend security summary
        if: always()
        run: |
          echo "## ⚛️ Frontend Security Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          NPM_COUNT="${{ steps.npm_audit.outputs.high_critical_count }}"
          LIC_COUNT="${{ steps.license_check.outputs.license_violations }}"
          [ "${NPM_COUNT:-0}" -eq "0" ] && echo "| npm audit | ✅ Pass |" >> $GITHUB_STEP_SUMMARY || echo "| npm audit | ❌ $NPM_COUNT HIGH/CRITICAL vulns |" >> $GITHUB_STEP_SUMMARY
          [ "${LIC_COUNT:-0}" -eq "0" ] && echo "| License check | ✅ Pass |" >> $GITHUB_STEP_SUMMARY || echo "| License check | ⚠️ $LIC_COUNT violations |" >> $GITHUB_STEP_SUMMARY

      - name: Upload frontend scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-security-reports
          path: ${{ env.REPORTS_DIR }}/npm-audit.json
          retention-days: 30

      - name: Enforce quality gate — npm audit
        if: steps.npm_audit.outputs.high_critical_count != '0' && steps.npm_audit.outputs.high_critical_count != ''
        run: |
          echo "❌ QUALITY GATE FAILED: ${{ steps.npm_audit.outputs.high_critical_count }} HIGH/CRITICAL npm vulnerabilities found."
          exit 1

  # ===========================================================================
  # JOB 3: Backend Security (Spring Boot / Java)
  # OWASP Dependency-Check + Semgrep Java SAST
  # ===========================================================================
  backend-security:
    name: "☕ Backend Security Scan"
    runs-on: ubuntu-latest
    needs: secret-detection

    defaults:
      run:
        working-directory: assess/country-service-main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Create reports directory
        run: mkdir -p ../../${{ env.REPORTS_DIR }}

      # -------------------------------------------------------------------------
      # Scanner 1: OWASP Dependency-Check — CVE scan for Java dependencies
      # Quality gate: fail on CVSS >= 7 (HIGH/CRITICAL CVEs)
      # -------------------------------------------------------------------------
      - name: OWASP Dependency-Check
        id: owasp
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=JSON \
            -DoutputDirectory=../../${{ env.REPORTS_DIR }} \
            -DsuppressionFile="" \
            --no-transfer-progress \
            -DnvdApiDelay=4000 \
            || echo "owasp_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # -------------------------------------------------------------------------
      # Scanner 2: Semgrep Java SAST
      # Checks for: SQL injection, XXE, insecure deserialization, Spring misconfig
      # -------------------------------------------------------------------------
      - name: Semgrep Java SAST
        id: semgrep_java
        run: |
          pip install semgrep --quiet
          semgrep \
            --config=p/java \
            --config=p/spring \
            --config=p/secrets \
            --json \
            --output ../../${{ env.REPORTS_DIR }}/semgrep-java.json \
            src/ || true
          # Count HIGH/CRITICAL findings
          FINDINGS=$(python3 -c "
          import json, sys
          try:
            d=json.load(open('../../${{ env.REPORTS_DIR }}/semgrep-java.json'))
            high=[r for r in d.get('results',[]) if r.get('extra',{}).get('severity','') in ['ERROR','WARNING']]
            print(len(high))
          except: print(0)
          ")
          echo "semgrep_findings=$FINDINGS" >> $GITHUB_OUTPUT
          echo "Semgrep findings: $FINDINGS"
        continue-on-error: true

      - name: Write backend security summary
        if: always()
        run: |
          echo "## ☕ Backend Security Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          OWASP_STATUS="${{ steps.owasp.outputs.owasp_failed }}"
          SG_COUNT="${{ steps.semgrep_java.outputs.semgrep_findings }}"
          [ -z "$OWASP_STATUS" ] && echo "| OWASP Dependency-Check | ✅ Pass |" >> $GITHUB_STEP_SUMMARY || echo "| OWASP Dependency-Check | ❌ HIGH/CRITICAL CVEs found |" >> $GITHUB_STEP_SUMMARY
          [ "${SG_COUNT:-0}" -eq "0" ] && echo "| Semgrep Java SAST | ✅ Pass |" >> $GITHUB_STEP_SUMMARY || echo "| Semgrep Java SAST | ⚠️ $SG_COUNT findings |" >> $GITHUB_STEP_SUMMARY

      - name: Upload backend scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: |
            ${{ env.REPORTS_DIR }}/dependency-check-report.json
            ${{ env.REPORTS_DIR }}/semgrep-java.json
          retention-days: 30

      - name: Enforce quality gate — OWASP
        if: steps.owasp.outputs.owasp_failed == 'true'
        run: |
          echo "❌ QUALITY GATE FAILED: HIGH/CRITICAL CVEs found in Java dependencies."
          echo "Review reports/dependency-check-report.json for details."
          exit 1

  # ===========================================================================
  # JOB 4: Container Security
  # Trivy scans the built Docker images for OS + library CVEs
  # ===========================================================================
  container-security:
    name: "🐳 Container Security Scan"
    runs-on: ubuntu-latest
    needs: [ frontend-security, backend-security ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      # -------------------------------------------------------------------------
      # Scanner 1: Trivy — IaC / Dockerfile misconfiguration scan
      # Checks Dockerfiles and docker-compose for security issues before building
      # -------------------------------------------------------------------------
      - name: Trivy IaC / config scan
        id: trivy_iac
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "json"
          output: "${{ env.REPORTS_DIR }}/trivy-iac.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Collect results; gate applied below
        continue-on-error: true

      # -------------------------------------------------------------------------
      # Scanner 2: Build and scan country-service image
      # -------------------------------------------------------------------------
      - name: Set up Java for backend build
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Build country-service JAR (skip tests for scan speed)
        run: |
          mvn package -DskipTests --no-transfer-progress -f assess/country-service-main/pom.xml
        continue-on-error: true

      - name: Build country-service Docker image
        run: |
          docker build -t country-service:scan \
            -f application/country-service/Dockerfile \
            assess/country-service-main/ 2>/dev/null || \
          echo "Dockerfile not found or build failed — skipping image scan"
        continue-on-error: true

      - name: Trivy image scan — country-service
        id: trivy_backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "country-service:scan"
          format: "json"
          output: "${{ env.REPORTS_DIR }}/trivy-backend.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      # -------------------------------------------------------------------------
      # Scanner 3: Trivy image scan for frontend
      # -------------------------------------------------------------------------
      - name: Set up Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build country-flags-app Docker image
        run: |
          docker build -t country-flags-app:scan \
            -f application/country-flags-app/Dockerfile \
            assess/country-flags-app-main/ 2>/dev/null || \
          echo "Dockerfile not found or build failed — skipping image scan"
        continue-on-error: true

      - name: Trivy image scan — country-flags-app
        id: trivy_frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "country-flags-app:scan"
          format: "json"
          output: "${{ env.REPORTS_DIR }}/trivy-frontend.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      - name: Parse Trivy results and apply quality gate
        id: trivy_gate
        if: always()
        run: |
          TOTAL_CRITICAL=0
          TOTAL_HIGH=0

          for report in ${{ env.REPORTS_DIR }}/trivy-*.json; do
            [ -f "$report" ] || continue
            CRITICAL=$(python3 -c "
          import json, sys
          try:
            d=json.load(open('$report'))
            results=d.get('Results',[]) or []
            vulns=[v for r in results for v in (r.get('Vulnerabilities') or []) if v.get('Severity')=='CRITICAL']
            print(len(vulns))
          except: print(0)
          ")
            HIGH=$(python3 -c "
          import json, sys
          try:
            d=json.load(open('$report'))
            results=d.get('Results',[]) or []
            vulns=[v for r in results for v in (r.get('Vulnerabilities') or []) if v.get('Severity')=='HIGH']
            print(len(vulns))
          except: print(0)
          ")
            echo "  $report → CRITICAL: $CRITICAL  HIGH: $HIGH"
            TOTAL_CRITICAL=$((TOTAL_CRITICAL + CRITICAL))
            TOTAL_HIGH=$((TOTAL_HIGH + HIGH))
          done

          echo "total_critical=$TOTAL_CRITICAL" >> $GITHUB_OUTPUT
          echo "total_high=$TOTAL_HIGH" >> $GITHUB_OUTPUT

          echo "## 🐳 Container Security Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | CRITICAL | HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy (all) | $TOTAL_CRITICAL | $TOTAL_HIGH |" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL_CRITICAL" -eq "0" ] && [ "$TOTAL_HIGH" -eq "0" ]; then
            echo "✅ **Container scans passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Container vulnerabilities found — review required**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload container scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-reports
          path: ${{ env.REPORTS_DIR }}/trivy-*.json
          retention-days: 30

      - name: Enforce quality gate — CRITICAL container vulnerabilities
        if: steps.trivy_gate.outputs.total_critical != '0' && steps.trivy_gate.outputs.total_critical != ''
        run: |
          echo "❌ QUALITY GATE FAILED: ${{ steps.trivy_gate.outputs.total_critical }} CRITICAL container vulnerabilities found."
          echo "Review trivy reports in ${{ env.REPORTS_DIR }}/ for details."
          exit 1

  # ===========================================================================
  # JOB 5: Pipeline Summary — consolidate all results
  # Runs last regardless of individual job outcomes
  # ===========================================================================
  pipeline-summary:
    name: "📊 Pipeline Security Summary"
    runs-on: ubuntu-latest
    needs: [ secret-detection, frontend-security, backend-security, container-security ]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true

      - name: Generate consolidated summary
        run: |
          echo "# 🛡️ DevSecOps Pipeline Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Secret Detection | ${{ needs.secret-detection.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚛️ Frontend Security | ${{ needs.frontend-security.result == 'success' && '✅ Pass' || needs.frontend-security.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ☕ Backend Security | ${{ needs.backend-security.result == 'success' && '✅ Pass' || needs.backend-security.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Container Security | ${{ needs.container-security.result == 'success' && '✅ Pass' || needs.container-security.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> All reports uploaded as workflow artifacts and retained for 30 days." >> $GITHUB_STEP_SUMMARY

      - name: Final gate — fail pipeline if any security job failed
        if: |
          needs.secret-detection.result == 'failure' ||
          needs.frontend-security.result == 'failure' ||
          needs.backend-security.result == 'failure' ||
          needs.container-security.result == 'failure'
        run: |
          echo "❌ PIPELINE FAILED: One or more security gates did not pass."
          echo "Review the job summaries above and uploaded artifacts for details."
          exit 1
