# =============================================================================
# Hardened Nginx configuration for country-flags-app
# Security controls: version hiding, security headers, CSP, no directory listing
# =============================================================================

# Run as non-root; worker_processes auto matches container CPU quota
worker_processes auto;

# Write pid to a location writable by the nginx user
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -- Security: hide nginx version from Server header and error pages --------
    server_tokens off;

    # -- Performance -----------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # -- Logging ---------------------------------------------------------------
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # -- Gzip compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # -- Security Headers --------------------------------------------------

        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Enable browser XSS filter (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer policy - don't leak URL to third parties
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy - tightly scoped for a React SPA
        # Adjust script-src if you add CDN assets
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://country-service:8081; font-src 'self'; frame-ancestors 'none';" always;

        # Permissions Policy - disable unused browser features
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # -- Disable directory listing -----------------------------------------
        autoindex off;

        # -- React SPA routing - serve index.html for all unknown paths --------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -- Static asset caching ---------------------------------------------
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # -- Block access to hidden files (.env, .git, etc.) ------------------
        location ~ /\. {
            deny all;
            return 404;
        }

        # -- Health check endpoint (used by Docker HEALTHCHECK) ----------------
        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # -- Custom error pages ------------------------------------------------
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
