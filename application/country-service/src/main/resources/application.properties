spring.application.name=Country API
server.port=8081
spring.datasource.url=${DB_URL:jdbc:h2:mem:countriesdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
# Credential injected via environment variable - no hardcoded secret.
# Provide DB_PASSWORD at runtime (see infrastructure/.env.example).
spring.datasource.password=${DB_PASSWORD:}
# H2 console disabled by default; enable only in dev via env var
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.hibernate.ddl-auto=update
# Profile via env var; defaults to dev for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Added this below since other logs where clustering my input
logging.level.org.hibernate.orm.connections.pooling=INFO
springdoc.swagger-ui.path=/custom-swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


