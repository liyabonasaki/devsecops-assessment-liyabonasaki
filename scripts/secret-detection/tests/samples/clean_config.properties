# Clean configuration file - no hardcoded secrets
# All sensitive values are injected via environment variables

spring.application.name=Country API
server.port=${SERVER_PORT:8081}

# Database - credentials come from environment
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# H2 console disabled in production
spring.h2.console.enabled=false

# External API
external.api.url=${EXTERNAL_API_URL}
external.api.key=${EXTERNAL_API_KEY}
